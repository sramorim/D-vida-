services:
  - type: worker
    name: shandon-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SHANDON_URL
        value: https://shandon-elite.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
